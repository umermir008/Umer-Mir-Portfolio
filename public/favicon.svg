    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0a0f1e"/>
  <circle cx="128" cy="128" r="100" fill="url(#g)" opacity="0.25" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#g)" stroke-width="10"/>
  <g fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="128" y="152" font-size="120">P</text>
